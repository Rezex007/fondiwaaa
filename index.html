<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ถึงฝน คนพิเศษของโอม 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', 'Mitr', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #fff0f5 0%, #ffd6e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* ปุ่มควบคุมเพลง */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #ff8da1;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 4px 12px rgba(255, 101, 132, 0.2);
            transition: all 0.3s ease;
        }

        .music-btn.playing {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* เอฟเฟกต์ดาวและหัวใจลอยพื้นหลัง */
        .bg-element {
            position: fixed;
            user-select: none;
            pointer-events: none;
            animation: floatUp 7s linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.6) rotate(0deg); opacity: 0.9; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3) rotate(25deg); opacity: 0; }
        }

        /* การ์ดหน้าแรก */
        .main-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(255, 154, 186, 0.35);
            text-align: center;
            position: relative;
            z-index: 10;
            border: 3px solid #ffffff;
        }

        .icon-box {
            font-size: 65px;
            margin-bottom: 10px;
            animation: heartPulse 1.8s infinite ease-in-out;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            color: #ff5c8a;
            font-size: 1.35rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .typewriter-text {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 50px;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #ff5c8a;
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .btn-open {
            background: linear-gradient(45deg, #ff6584, #ff8da1);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(255, 101, 132, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            font-weight: 500;
        }

        .btn-open:active { transform: scale(0.95); }

        /* Modal หน้าต่างแชท */
        .chat-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 230, 238, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            padding: 15px;
        }

        .chat-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .chat-box {
            background: #fff8fa;
            width: 100%;
            max-width: 380px;
            height: 560px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(255, 130, 168, 0.25);
            transform: scale(0.85);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid #ffffff;
        }

        .chat-modal.active .chat-box { transform: scale(1); }

        .chat-header {
            background: #ffffff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #ffe3ec;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: #ffe6eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #ffb6c1;
        }

        .user-info h2 { font-size: 1.05rem; color: #444; font-weight: 500; }
        .user-info p { font-size: 0.78rem; color: #ff5c8a; }

        .chat-body {
            flex: 1;
            padding: 20px 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ข้อความแชท */
        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 22px;
            font-size: 0.93rem;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(15px) scale(0.9);
            animation: msgPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            word-break: break-word;
        }

        .msg-ohm {
            background: #ffffff;
            color: #4a4a4a;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.15);
            border: 1px solid #ffe3ec;
        }

        .msg-rain {
            background: linear-gradient(45deg, #ff6584, #ff8da1);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 12px rgba(255, 101, 132, 0.25);
        }

        @keyframes msgPop {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .typing-indicator {
            background: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            align-self: flex-start;
            display: none;
            gap: 5px;
            align-items: center;
            border: 1px solid #ffe3ec;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: #ff8fa3;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Footer & ช่องพิมพ์ตอบกลับ */
        .chat-footer {
            padding: 12px 15px;
            background: #ffffff;
            border-top: 1px solid #ffe3ec;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-forgive {
            background: linear-gradient(45deg, #ff6584, #ff8da1);
            color: white;
            border: none;
            padding: 12px;
            font-size: 0.98rem;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(255, 101, 132, 0.3);
            transition: all 0.2s ease;
        }

        .reply-input-box {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .reply-input-box input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #ffd0df;
            border-radius: 25px;
            outline: none;
            font-size: 0.92rem;
            color: #444;
            background: #fff8fa;
        }

        .reply-input-box input:focus {
            border-color: #ff6584;
        }

        .btn-send {
            background: #ff6584;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(255, 101, 132, 0.3);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- ปุ่มเปิด-ปิดเพลง -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>
    <audio id="bgm" loop preload="auto">
        <source src="https://cdn.discordapp.com/attachments/1467039291678003301/1539206650458546176/Y2Mate.is_-_TEDz_-_Official_MV.mp3?ex=6a857966&is=6a8427e6&hm=209f79877fc5f84e712201a47578fa3ee0df1eb4cead620d031fe0b9d70a8f09&" type="audio/mpeg">
    </audio>

    <!-- หน้าแรก -->
    <div class="main-card">
        <div class="icon-box">🎀</div>
        <h1>ถึงฝน คนพิเศษของโอม</h1>
        <div class="typewriter-text"><span id="typed"></span><span class="cursor"></span></div>
        <button class="btn-open" id="open-btn" onclick="openChat()" style="display: none;">🔓 จิ้มๆเลยจ้าาคุณฝน</button>
    </div>

    <!-- หน้าต่างแชท -->
    <div class="chat-modal" id="chatModal">
        <div class="chat-box">
            <div class="chat-header">
                <div class="avatar">👦🏻</div>
                <div class="user-info">
                    <h2>โอมสุดแสนจะน่ารักของฝน</h2>
                    <p id="status-text">กำลังพิมพ์ข้อความ...</p>
                </div>
            </div>

            <div class="chat-body" id="chatBody">
                <div class="typing-indicator" id="typing">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>

            <div class="chat-footer">
                <!-- ปุ่มกดหายงอน -->
                <button class="btn-forgive" id="forgiveBtn" onclick="forgiveMe(event)" style="display: none;">หายงอนโอมได้มั้ยครับ</button>
                
                <!-- ช่องพิมพ์ตอบกลับ -->
                <div class="reply-input-box" id="replyBox" style="display: none;">
                    <input type="text" id="userInput" placeholder="พิมพ์บอกโอมตรงนี้ได้เลยน้า..." onkeypress="handleKeyPress(event)">
                    <button class="btn-send" onclick="sendMessage()">ส่ง 💕</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // *** ⚙️ DISCORD WEBHOOK URL ***
        const DISCORD_WEBHOOK_URL = "https://canary.discord.com/api/webhooks/1539201967316803615/cJlf0dEH9ZErIcUXIuKQFCZDAnnZh3hf2d2Q_dRADjZRRS8lNKopOCVtS4UXLU98cU1E"; 
        
        // --- ระบบเพลง BGM ---
        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgm.pause();
                musicBtn.classList.remove('playing');
                musicBtn.innerText = '🔇';
            } else {
                bgm.play().then(() => {
                    bgm.volume = 0.35;
                    musicBtn.classList.add('playing');
                    musicBtn.innerText = '🎵';
                }).catch(e => console.log("Music play blocked: ", e));
            }
            isPlaying = !isPlaying;
        }

        // --- 1. ข้อความเปิดตัวของโอม ---
        const messages = [
            "ฝนสุดที่รักของโอม",
            "โอมขอโทษที่ทำตัวไม่น่ารักใส่",
            "ไม่ได้ตั้งใจทำให้ฝนต้องเสียใจเพราะเราเลยนะ",
            "ไม่มีใครน่ารักเท่าฝนแล้วน้าาา",
            "หายงอนโอมได้มั้ยเรามาง้อแล้วน้าาาจุ้บบบ👉👈"
        ];

        // --- ระบบจำแนกความรู้สึกและคีย์เวิร์ด ---
        const badWords = ["ควย", "ส้นตีน", "เหี้ย", "สัตว์", "เย็ด", "มึง", "กู", "พ่อมึง", "แม่มึง", "ควาย", "โง่", "บ้า", "สัส", "น่ารำคาญ", "ตลกร้าย"];
        const loveWords = ["รัก", "จุ๊บ", "หอม", "คิดถึง", "แฟน", "น่ารัก", "ง้อ", "กอด"];
        const foodWords = ["หิว", "กิน", "ขนม", "ชาไข่มุก", "เค้ก", "ข้าว", "อร่อย", "ชาบูกิน"];

        const badWordReplies = [
            "ด่าทำไมง่ะ โอมเสียใจนะ... 🥺💔",
            "โอ๋ๆ อย่าเพิ่งด่าโอมสิคะ โอมขอโทษแล้วน้า 😔",
            "โอมผิดไปแล้ว อย่าด่าโอมแรงสิครับ ใจเสียหมดแล้ว 🥺",
            "ด่าโอมแบบนี้แสดงว่ายังงอนอยู่ใช่ไหมคะ... โอมโอ๋ๆ น้า 🤍"
        ];

        const loveWordReplies = [
            "โอมก็รักฝนที่สุดในโลกเลยยย 🥰💕",
            "ฟังแล้วหัวใจฟูเลย ขอกอดแน่นๆ ทีหนึ่งน้า ✨",
            "คิดถึงฝนเหมือนกันครับ อยากไปอยู่ข้างๆ ตอนนี้เลย 🥺🤍",
            "น่ารักที่สุดในโลกแล้วคนนี้ ของโอมคนเดียวด้วย! 🎀"
        ];

        const foodWordReplies = [
            "พาไปกินแน่นอนครับ! ฝนอยากกินอะไรเลือกไว้เลยเดี๋ยวโอมเลี้ยงเอง 🍰😋",
            "หิวแล้วหรอคะ? เดี๋ยวพาไปหาของอร่อยๆ ทานน้า คนดีจะได้อารมณ์ดี ✨",
            "เตรียมปักหมุดร้านโปรดฝนไว้แล้วครับ ป่ะไปกินกัน! 🧋🍔"
        ];

        const generalReplies = [
            "รับทราบครับผม! โอมตั้งใจฟังฝนอยู่น้า 🥰",
            "โอ๋ๆ น้าคนดี โอมอยู่ตรงนี้เสมอครับ 💕",
            "ดีใจจังได้คุยกับฝนแล้ว ยิ้มเยอะๆ น้า 😊",
            "ฝนน่ารักที่สุดเลย ขอบคุณที่ไม่โกรธโอมน้า ✨",
            "โอมสัญญาว่าจะดูแลฝนให้ดีกว่าเดิมแน่นอนครับ 🤍"
        ];

        // --- 2. พิมพ์ทีละตัวหน้าแรก ---
        const introText = "โอมมีเรื่องอยากบอกฝนเยอะเลยยยย\nกดเปิดตรงนี้หน่อยน้าาา";
        let textIndex = 0;
        const typedElement = document.getElementById("typed");
        const openBtn = document.getElementById("open-btn");

        function typeWriter() {
            if (textIndex < introText.length) {
                typedElement.innerHTML += introText.charAt(textIndex) === '\n' ? '<br>' : introText.charAt(textIndex);
                textIndex++;
                setTimeout(typeWriter, 80);
            } else {
                openBtn.style.display = "block";
            }
        }

        // --- 3. สร้างพื้นหลังหัวใจและดาว ---
        function createBgElements() {
            const items = ['💖', '✨', '🌸', '💕', '⭐', '🤍'];
            setInterval(() => {
                const el = document.createElement('div');
                el.classList.add('bg-element');
                el.innerText = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (Math.random() * 12 + 18) + 'px';
                el.style.animationDuration = (Math.random() * 3 + 5) + 's';
                document.body.appendChild(el);

                setTimeout(() => { el.remove(); }, 7000);
            }, 450);
        }

        window.onload = () => {
            typeWriter();
            createBgElements();
        };

        // --- 4. ระบบส่งแชทเริ่มต้น ---
        const chatModal = document.getElementById('chatModal');
        const chatBody = document.getElementById('chatBody');
        const typing = document.getElementById('typing');
        const statusText = document.getElementById('status-text');
        const forgiveBtn = document.getElementById('forgiveBtn');
        const replyBox = document.getElementById('replyBox');

        function openChat() {
            chatModal.classList.add('active');
            if (!isPlaying) toggleMusic();
            startSendingMessages();
        }

        async function startSendingMessages() {
            for (let i = 0; i < messages.length; i++) {
                showTyping(true);
                await sleep(1300);
                
                showTyping(false);
                appendMessage(messages[i], 'msg-ohm');
                await sleep(500);
            }

            statusText.innerText = "ออนไลน์";
            forgiveBtn.style.display = "block";
        }

        function showTyping(isTyping) {
            if (isTyping) {
                typing.style.display = 'flex';
                chatBody.appendChild(typing);
                chatBody.scrollTop = chatBody.scrollHeight;
            } else {
                typing.style.display = 'none';
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', className);
            msgDiv.innerText = text;
            chatBody.insertBefore(msgDiv, typing);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // --- 5. ปุ่มหายงอนพร้อมเอฟเฟกต์พลุเฉลิมฉลอง ---
        function forgiveMe(event) {
            try {
                // เอฟเฟกต์หัวใจพุ่งกระจายรอบทิศ
                const heartShape = confetti.shapeFromText({ text: '💖', scalar: 2 });
                const starShape = confetti.shapeFromText({ text: '✨', scalar: 2 });
                
                confetti({
                    shapes: [heartShape, starShape],
                    scalar: 3,
                    particleCount: 60,
                    spread: 120,
                    origin: { y: 0.6 }
                });

                // เพิ่มเอฟเฟกต์พลุสองข้าง
                setTimeout(() => {
                    confetti({ particleCount: 30, angle: 60, spread: 55, origin: { x: 0 } });
                    confetti({ particleCount: 30, angle: 120, spread: 55, origin: { x: 1 } });
                }, 200);

            } catch (e) {
                console.log(e);
            }

            forgiveBtn.style.display = 'none';
            replyBox.style.display = 'flex';

            setTimeout(() => {
                appendMessage("เย้!! ขอบคุณนะคะคนดี พิมพ์บอกโอมได้ตลอดเลยน้า 🤍✨", 'msg-ohm');
            }, 400);
        }

        // --- 6. ส่งข้อความ + ระบบวิเคราะห์ข้อความตอบกลับ ---
        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();

            if (text !== "") {
                appendMessage(text, 'msg-rain');
                input.value = "";

                sendToWebhook(text);
                generateOhmResponse(text);
            }
        }

        function generateOhmResponse(userText) {
            const textLower = userText.toLowerCase();

            const hasBadWord = badWords.some(word => textLower.includes(word));
            const hasLoveWord = loveWords.some(word => textLower.includes(word));
            const hasFoodWord = foodWords.some(word => textLower.includes(word));

            let botReply = "";

            if (hasBadWord) {
                botReply = badWordReplies[Math.floor(Math.random() * badWordReplies.length)];
            } else if (hasLoveWord) {
                botReply = loveWordReplies[Math.floor(Math.random() * loveWordReplies.length)];
            } else if (hasFoodWord) {
                botReply = foodWordReplies[Math.floor(Math.random() * foodWordReplies.length)];
            } else {
                botReply = generalReplies[Math.floor(Math.random() * generalReplies.length)];
            }

            setTimeout(() => {
                showTyping(true);
                setTimeout(() => {
                    showTyping(false);
                    appendMessage(botReply, 'msg-ohm');
                }, 1000 + Math.random() * 500);
            }, 400);
        }

        function sendToWebhook(messageText) {
            if (!DISCORD_WEBHOOK_URL) return;

            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `💌 **ฝนตอบกลับมาว่า**: "${messageText}"`
                })
            }).catch(err => console.error("Error sending webhook:", err));
        }
    </script>
</body>
</html>
